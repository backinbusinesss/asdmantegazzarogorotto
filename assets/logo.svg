<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo ASD Mantegazza Rogorotto: tigre verde che stringe un pallone da pallavolo">
  <defs>
    <path id="arcTop" d="M 66 256 A 190 190 0 0 1 446 256"/>
    <path id="arcBottom" d="M 52 256 A 204 204 0 0 0 460 256"/>
    <clipPath id="inner"><circle cx="256" cy="256" r="169"/></clipPath>
    <clipPath id="ballClip"><circle cx="256" cy="384" r="90"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDEFE2"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CCB62"/>
      <stop offset=".6" stop-color="#25A94B"/>
      <stop offset="1" stop-color="#18873A"/>
    </linearGradient>
    <linearGradient id="furArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FB955"/>
      <stop offset="1" stop-color="#167A35"/>
    </linearGradient>
    <radialGradient id="ballShade" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".7" stop-color="#0A2540" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A2540" stop-opacity=".28"/>
    </radialGradient>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="fat"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="fat" operator="in" result="outline"/>
      <feDropShadow in="outline" dx="0" dy="6" stdDeviation="6" flood-color="#0A2540" flood-opacity=".35" result="shadowed"/>
      <feMerge><feMergeNode in="shadowed"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0B5A28" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0B5A28" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballHi" cx="34%" cy="22%" r="40%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <path id="claw" d="M0 0 C7 -4 15 -1 17 7 C12 4 6 4 0 6 Z" fill="#FFF7E2" stroke="#0B1B12" stroke-width="2.5" stroke-linejoin="round"/>
  </defs>

  <!-- ===== badge ===== -->
  <circle cx="256" cy="256" r="250" fill="#0A2540"/>
  <circle cx="256" cy="256" r="239" fill="none" stroke="#2BB24C" stroke-width="3"/>
