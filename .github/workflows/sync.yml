name: Aggiorna calendario e risultati

on:
  schedule:
    # ogni 30 minuti (orari UTC; GitHub può ritardare di qualche minuto)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica dati Volley Cup
        run: python scripts/sync.py
      - name: Salva se ci sono novità
        run: |
          if git diff --quiet -- data/season.json; then
            echo "Nessuna novità"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/season.json
          git commit -m "Aggiorna risultati Volley Cup"
          git push
